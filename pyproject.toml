[project]
name = "struck"
version = "0.1.0"
description = "Struck by Refractic Labs: human-in-the-loop trading orchestration for Strike Finance and Cardano"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13.5",
    "langgraph>=1.2.12",
    "httpx>=0.28.1",
    "struck_py",
    "pycardano==0.19.2",
    "cbor2>=5.7.1,<6",
    # UI (spec D1): Qt for Python / PySide6 (LGPL), chosen 2026-10-21 for
    # open-source licensing (not PyQt6). pyqtgraph 0.14.0 supports PySide6.
    # finplot is NOT added (unapproved new dependency, spec §7.2).
    "PySide6==6.12.0",
    "pyqtgraph==0.14.0",
    "langchain==1.4.3",
    # Already imported by struck/strike/auth.py (Ed25519 request signing); declared, not new.
    "pynacl==1.6.2",
    "keyring==25.7.0",
    "keyrings-cryptfile==1.3.9",
]

[project.optional-dependencies]
# LLM providers: ONE stock factory,
# langchain.chat_models.init_chat_model; each provider's stock integration is
# an exact-pinned extra. A provider whose extra is not installed fails loudly.
llm-openai = [
    "langchain-openai==1.7.2",
]
llm-anthropic = [
    "langchain-anthropic==1.7.6",
]
llm-ollama = [
    "langchain-ollama==1.1.0",
]
llm-openrouter = [
    "langchain-openrouter==0.2.9",
]
llm-google-genai = [
    "langchain-google-genai==4.4.2",
]
llm-google-vertexai = [
    "langchain-google-vertexai==3.2.4",
]
llm-bedrock = [
    "langchain-aws==1.9.0",
]
llm-mistralai = [
    "langchain-mistralai==1.1.6",
]
llm-groq = [
    "langchain-groq==1.1.3",
]
llm-xai = [
    "langchain-xai==1.3.0",
]
llm-deepseek = [
    "langchain-deepseek==1.1.1",
]
llm-fireworks = [
    "langchain-fireworks==1.7.1",
]
llm-together = [
    "langchain-together==0.4.0",
]
llm-cohere = [
    "langchain-cohere==0.6.0",
]
llm-perplexity = [
    "langchain-perplexity==1.4.2",
]
llm-all = [
    "struck[llm-openai,llm-anthropic,llm-ollama,llm-openrouter,llm-google-genai,llm-google-vertexai,llm-bedrock,llm-mistralai,llm-groq,llm-xai,llm-deepseek,llm-fireworks,llm-together,llm-cohere,llm-perplexity]",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "pytest>=9.1.1",
    "pytest-qt==4.5.0",
]

[tool.uv.sources]
# The Rust money core (PyO3/maturin), built from the in-repo crate — same

struck_py = { path = "rust/struck_py", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# lint rule set; no ignores.
select = ["E4", "E7", "E9", "F", "E722", "S110", "S112", "BLE001", "PGH004"]

[tool.mypy]
# strict, every disallow_any_*.
python_version = "3.14"
explicit_package_bases = true
# Stubs for untyped deps (pycardano ships no py.typed);

mypy_path = "typings/third_party"
strict = true
check_untyped_defs = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_subclassing_any = true
warn_unreachable = true
disallow_any_decorated = true
ignore_missing_imports = false
disallow_any_explicit = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
plugins = ["pydantic.mypy"]
